:root{
 --indigo:#3B3B6E;--i950:#0C0C20;--i900:#15152F;--i800:#20204A;
 --accent:#2E90FF;--accent2:#7DBBFF;--accenth:#1B72DC;--red:#CC0000;
 --ondark:#F1F1FA;--ondark2:#A0A0C8;--bd:rgba(255,255,255,.15);--warn:#FF8B8B;--warn-bg:rgba(255,80,80,.1);--warn-bd:rgba(255,120,120,.3);--radius-s:10px;--radius-m:18px;--radius-l:24px;
 --disp:"TT Text","Segoe UI",Arial,sans-serif;--body:"TT Text","Segoe UI",Arial,sans-serif;
 --cond:"TT Display","Arial Narrow",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:var(--accent);color:#fff}
h1,h2,h3{font-family:var(--disp);line-height:1.05;font-weight:700}
body{font-family:var(--body);font-size:16px;line-height:1.6;color:var(--ondark);
 background:radial-gradient(1200px 800px at 80% -20%,#26265c 0%,transparent 55%),
  radial-gradient(1000px 700px at -15% 115%,#1a1a40 0%,transparent 60%),
  linear-gradient(168deg,var(--i950) 0%,var(--i900) 50%,var(--i800) 100%);
 background-attachment:fixed;overflow-x:hidden;min-height:100vh}
/* ===== СЦЕНА: орбы, шестерёнка, призрачный текст ===== */
.scene-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(95px)}
.orb-a{width:640px;height:640px;left:60%;top:-240px;background:radial-gradient(circle,rgba(46,144,255,.32),transparent 65%);animation:dfa 19s ease-in-out infinite}
.orb-b{width:520px;height:520px;left:-200px;top:32%;background:radial-gradient(circle,rgba(110,110,205,.28),transparent 65%);animation:dfb 26s ease-in-out infinite}
.orb-c{width:440px;height:440px;left:46%;bottom:-200px;background:radial-gradient(circle,rgba(46,144,255,.16),transparent 65%);animation:dfa 31s ease-in-out infinite reverse}
@keyframes dfa{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,50px) scale(1.12)}}
@keyframes dfb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-46px) scale(.92)}}
.gear{position:absolute;right:-220px;top:6vh;width:620px;height:620px;opacity:.05;animation:spin 160s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ghost{position:absolute;left:50%;top:40vh;transform:translateX(-50%);white-space:nowrap;
 font-family:var(--cond);font-style:italic;font-weight:700;font-size:min(24vw,230px);letter-spacing:.02em;
 color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.05);user-select:none}
#app{position:relative;z-index:2;max-width:720px;margin:0 auto;min-height:100vh}
/* ===== ШАПКА nav.glass ===== */
.hd{position:sticky;top:16px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:18px;
 margin:20px 14px 0;padding:13px 16px 13px 24px;border-radius:999px;
 background:linear-gradient(135deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.03) 100%);
 -webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);
 border:1px solid var(--bd);
 box-shadow:0 22px 60px rgba(5,5,20,.5),inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.05)}
.lg{display:flex;align-items:center;gap:14px;min-width:0}
.lg .logo{height:32px;width:auto;display:block;filter:drop-shadow(0 1px 5px rgba(0,0,0,.45))}
.lg b{color:#fff;font-family:var(--disp);font-weight:500;font-size:15px;letter-spacing:.2px;white-space:nowrap;
 border-left:1px solid rgba(255,255,255,.18);padding-left:14px}
.hd .sub{color:var(--accent2);font-size:12.5px;font-weight:500;white-space:nowrap;padding-right:8px}
.pbar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);margin:18px 20px 0;overflow:hidden}
.pbar>i{display:block;height:100%;width:0;border-radius:99px;
 background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 16px rgba(46,144,255,.8);transition:width .3s cubic-bezier(.2,.7,.2,1)}
.body{padding:22px 20px 8px}
/* фирменный kicker */
.kicker{display:inline-flex;align-items:center;gap:10px;color:var(--accent2);font-size:13px;letter-spacing:.08em;margin-bottom:18px;
 padding:8px 18px;border-radius:999px;border:1px solid rgba(125,187,255,.25);background:rgba(46,144,255,.07)}
.brandline{font-family:var(--cond);font-style:italic;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(46,144,255,.7);animation:pls 2.2s infinite}
@keyframes pls{70%{box-shadow:0 0 0 11px rgba(46,144,255,0)}100%{box-shadow:0 0 0 0 rgba(46,144,255,0)}}
.stept{color:#fff;font-family:var(--disp);font-weight:700;font-size:18px;margin-bottom:6px;line-height:1.05}
.steph{color:var(--ondark2);font-size:13.5px;margin-bottom:16px;line-height:1.5}
.axtitle{font-family:var(--disp);font-size:clamp(24px,3.4vw,30px);font-weight:700;color:#fff;letter-spacing:-.01em;margin:4px 0}
/* стекло-карточки */
.card{position:relative;border-radius:24px;padding:22px;margin-bottom:16px;overflow:hidden;
 background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
 -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
 border:1px solid var(--bd);box-shadow:0 20px 55px rgba(5,5,20,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:radial-gradient(130% 65% at 16% -10%,rgba(255,255,255,.15) 0%,transparent 55%)}
.card>*{position:relative;z-index:1}
.q{font-size:16.5px;font-weight:500;line-height:1.4;margin-bottom:10px;color:#fff}
.qh{font-size:13.5px;font-weight:400;color:var(--ondark2);margin:-5px 0 12px;line-height:1.45}
.opts{display:flex;gap:9px;flex-wrap:wrap}
.opt{font:inherit;font-size:14px;font-weight:500;padding:10px 17px;border-radius:999px;cursor:pointer;color:var(--ondark);
 background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);transition:all .2s}
.opt:hover{border-color:var(--accent);color:#fff;box-shadow:0 0 18px rgba(46,144,255,.35)}
.opt.sel,.opt.selm{color:#fff;border-color:transparent;
 background:linear-gradient(180deg,#55A7FF 0%,var(--accent) 45%,var(--accenth) 100%);
 box-shadow:0 10px 26px rgba(46,144,255,.42),inset 0 1px 0 rgba(255,255,255,.5)}
.tawrap{position:relative}
.ta{width:100%;border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-m);padding:13px 48px 13px 15px;font:inherit;font-size:15px;
 color:var(--ondark);background:rgba(255,255,255,.05);resize:vertical;min-height:56px;line-height:1.5;
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ta.own{min-height:42px;margin-top:10px}
.ta::placeholder{color:rgba(160,160,200,.65)}
.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,144,255,.2),0 0 22px rgba(46,144,255,.25)}
.mic{position:absolute;right:9px;top:9px;width:36px;height:36px;border-radius:var(--radius-s);cursor:pointer;padding:0;
 display:flex;align-items:center;justify-content:center;color:var(--ondark2);
 background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22)}
.mic:hover{border-color:var(--accent);color:var(--accent2);background:rgba(255,255,255,.13)}
.mic.rec{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn);animation:recp 1s infinite}
@keyframes recp{50%{opacity:.5}}
.ft{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px 30px}
.back{background:none;border:none;color:var(--accent2);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.back:hover{color:#fff;text-shadow:0 0 16px rgba(46,144,255,.9)}
.prog{color:var(--ondark2);font-size:13px}
.next{position:relative;overflow:hidden;padding:15px 30px;border-radius:999px;color:#fff;font:inherit;font-size:15px;font-weight:500;border:none;cursor:pointer;
 background:linear-gradient(180deg,#55A7FF 0%,var(--accent) 45%,var(--accenth) 100%);
 box-shadow:0 12px 34px rgba(46,144,255,.45),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .2s,box-shadow .2s}
.next::after{content:"";position:absolute;top:0;left:-90%;width:55%;height:100%;transform:skewX(-20deg);
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{0%,55%{left:-90%}75%,100%{left:140%}}
.next:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 16px 44px rgba(46,144,255,.6),inset 0 1px 0 rgba(255,255,255,.55)}
.foot{color:var(--ondark2);font-size:11px;text-align:center;line-height:1.55;padding:16px 24px 30px;opacity:.7}
.big{font-family:var(--disp);font-size:clamp(26px,4vw,34px);font-weight:700;color:#fff;margin-bottom:16px;line-height:1.1;letter-spacing:-.01em}
.lead{font-size:15.5px;line-height:1.6;color:var(--ondark);margin-bottom:12px}
.lead b{background:linear-gradient(92deg,#9CCBFF,var(--accent) 55%,#5EA8FF);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 6s ease-in-out infinite}
@keyframes grad{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.why{position:relative;border-radius:20px;padding:16px 18px;margin-bottom:16px;font-size:14px;line-height:1.55;color:var(--ondark);overflow:hidden;
 background:linear-gradient(150deg,rgba(46,144,255,.13),rgba(46,144,255,.03));border:1px solid rgba(125,187,255,.28);
 -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.why b{color:var(--accent2)}
.res{border-radius:18px;padding:15px 17px;white-space:pre-wrap;font-size:13px;line-height:1.55;max-height:250px;overflow:auto;color:var(--ondark);
 background:rgba(255,255,255,.05);border:1px solid var(--bd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.send{border-radius:20px;padding:18px;margin-top:14px;overflow:hidden;
 background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--bd);
 -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
 box-shadow:0 20px 55px rgba(5,5,20,.45),inset 0 1px 0 rgba(255,255,255,.28)}
.send .t{font-family:var(--disp);font-weight:700;color:#fff;margin-bottom:8px;font-size:18px}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.rbtn{padding:12px 22px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;
 color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);
 -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);transition:all .2s}
.rbtn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);transform:translateY(-2px)}
.rbtn.pri{border-color:transparent;background:linear-gradient(180deg,#55A7FF 0%,var(--accent) 45%,var(--accenth) 100%);
 box-shadow:0 12px 30px rgba(46,144,255,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.okmsg{color:var(--accent2);font-size:13px;margin-top:8px;display:none}
.hint{color:var(--ondark2);font-size:12.5px;margin-top:8px;line-height:1.5}
.contact{margin-top:12px;font-size:13px;color:var(--ondark2);line-height:1.5}.contact a{color:var(--accent2);text-decoration:none}.contact a:hover{color:#fff}
.skip{color:var(--ondark2);font-size:13px;line-height:1.5;text-align:center;padding:2px 8px 10px;font-style:italic;opacity:.85}
.fdir{font-family:var(--cond);font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--ondark2);text-align:center;padding:14px 24px 0;line-height:1.5}
.fdir b{color:var(--accent);font-weight:700}
@media (max-width:560px){.ghost{display:none}.lg b{font-size:12.5px;padding-left:9px}.lg .logo{height:26px}.hd{padding:11px 13px 11px 16px;gap:10px}.hd .sub{font-size:11px;padding-right:2px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
</head>

  var t=e.target.closest('[data-a],[data-m],[data-nav],[data-mic]'); if(!t)return;
  if(t.dataset.mic){voice(t.dataset.mic);return;}
  if(t.dataset.a){ans[t.dataset.a]=t.dataset.v;save();render();return;}
  if(t.dataset.m){var id=t.dataset.m,v=t.dataset.v,a=ans[id]||[];var k=a.indexOf(v);if(k>-1)a.splice(k,1);else a.push(v);ans[id]=a;save();render();return;}

  else if(nav==='start'){view='block';i=0;render();window.scrollTo(0,0);}
